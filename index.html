<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F2F4F6">
<meta name="description" content="생수 배송 건수 기록과 정산월(26일~다음달 25일) 실적·금액 확인">
<title>생수</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="생수">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css');

:root{
  --bg:#F2F4F6; --white:#FFFFFF;
  --t1:#191F28; --t2:#4E5968; --t3:#8B95A1; --t4:#B0B8C1;
  --blue:#3182F6; --blue-d:#1B64DA; --blue-l:#E8F3FF;
  --red:#F04452; --line:#F2F4F6; --press:#E5E8EB;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--bg)}
/* 안드로이드에서 위로 쓸면 '당겨서 새로고침' 이 걸려 앱이 재시작된 것처럼 보인다 */
html{overscroll-behavior-y:contain}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,
    'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',system-ui,sans-serif;
  color:var(--t1); font-size:17px; line-height:1.5; letter-spacing:-0.02em;
  -webkit-font-smoothing:antialiased;
  /* 한글은 기본값이면 글자 아무 곳에서나 잘린다. 어절 단위로 넘긴다 */
  word-break:keep-all; overflow-wrap:break-word;
}
/* 길게 눌러도 글자 선택 핸들이 뜨지 않게 — 입력칸은 당연히 예외 */
button, .bar, .hero, .card .head, .row, .field, .brow .bd, .q, .qs, .note, .bsum, .slist .gh, .toast{
  user-select:none; -webkit-user-select:none;
}
input{user-select:text; -webkit-user-select:text}
.app{max-width:480px; margin:0 auto; min-height:100vh; padding:0 20px 132px; position:relative}
button{font:inherit; letter-spacing:inherit; cursor:pointer}

/* 화면 전환
   주의: 여기서 transform 을 쓰면 안 된다. 조상에 transform 이 걸리는 동안
   position:fixed 인 하단 버튼(.cta)의 기준이 뷰포트가 아니라 이 요소가 되어
   화면을 넘길 때마다 버튼이 엉뚱한 자리에서 튀어 들어온다. 그래서 투명도만 쓴다. */
.view{display:none}
.view.on{display:block; animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ───── 상단바 ─────
   위계 규칙
   · 뒤로가기(.back) : 화면 왼쪽 위에 단 하나. 진한 굵은 화살표. 다른 어디에도 안 쓴다.
   · 값 바꾸기(.pill) : 글자 + 아래 캐럿(▾). 누르면 선택 시트가 올라온다.
   · 목록 진입(.row › ) : 줄 오른쪽의 작고 연한 꺾쇠.                                */
.bar{min-height:60px; display:flex; align-items:center; gap:4px; margin:0 -6px}
.back{
  width:44px; height:44px; flex:none; display:flex; align-items:center; justify-content:center;
  border:0; background:none; padding:0; color:var(--t1); border-radius:50%;
}
.back:active{background:var(--press)}
.bar .htitle{font-size:19px; font-weight:700; padding-left:2px}
.pill{
  display:inline-flex; align-items:center; gap:6px; height:44px; padding:0 8px 0 10px;
  border:0; background:none; border-radius:12px; color:var(--t1);
  font-size:22px; font-weight:800; letter-spacing:-0.035em;
}
.pill:active{background:var(--press)}
.pill .car{color:var(--t3); display:flex}
.pill.sm{font-size:17px; font-weight:700; height:40px}

/* ───── 히어로 ───── */
.hero{padding:14px 4px 34px}
.hero .cap{font-size:15px; color:var(--t3); font-weight:600}
.hero .big{
  font-size:44px; font-weight:800; letter-spacing:-0.045em; line-height:1.16;
  margin-top:8px; font-variant-numeric:tabular-nums;
}
.hero .big em{font-style:normal; font-size:30px; font-weight:700; letter-spacing:-0.03em}
/* 금액은 건수에서 파생된 값 — 항상 건수 아래, 한 단계 작게 */
.hero .money{
  margin-top:6px; font-size:26px; font-weight:700; letter-spacing:-0.035em;
  font-variant-numeric:tabular-nums; color:var(--t1);
}
.hero .money em{font-style:normal; font-size:17px; font-weight:600; color:var(--t3); margin-left:1px}
.linkbtn{border:0; background:none; padding:0; margin:0; font:inherit; color:var(--blue); font-weight:600}
/* 화면 안의 보조 이동 (같은 과업의 다른 방식) */
.altlink{
  display:flex; align-items:center; justify-content:center; gap:4px; width:100%;
  margin:26px 0 0; padding:12px; border:0; background:none;
  color:var(--blue); font-size:16px; font-weight:600;
}

/* ───── 카드 / 목록 ───── */
.card{background:var(--white); border-radius:20px; padding:8px 20px; margin-bottom:14px}
.card .head{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 0 6px; font-size:15px; color:var(--t3); font-weight:600;
}
.row{
  display:flex; align-items:center; gap:12px; width:100%; padding:17px 0;
  border:0; border-top:1px solid var(--line); background:none;
  text-align:left; color:var(--t1);
}
.card .head + .row{border-top:0}
.row:first-child{border-top:0}
.row:active{background:#FAFBFC}
.row .l{flex:1; font-size:16px; color:var(--t2); font-weight:500}
.row .l .tag{
  display:inline-block; margin-left:6px; padding:2px 7px; border-radius:6px;
  background:var(--blue-l); color:var(--blue); font-size:12px; font-weight:700; vertical-align:2px;
}
.row .l .muted{color:var(--t4); font-weight:500}
.row .r{font-size:17px; font-weight:700; font-variant-numeric:tabular-nums}
.row .r small{color:var(--t3); font-weight:500; margin-left:2px; font-size:15px}
.row .c{color:var(--t4); display:flex; flex:none}
.blank{padding:30px 0 34px; text-align:center; color:var(--t3); font-size:16px; font-weight:500}
.txtdel{
  flex:none; margin-left:4px; padding:8px 2px 8px 10px; border:0; background:none;
  color:var(--t3); font-size:15px; font-weight:500; text-decoration:underline;
}

/* 줄 모양 진입 버튼 */
/* height 를 고정하면 좁은 화면에서 부제가 두 줄이 될 때 잘린다 */
.field{
  display:flex; align-items:center; gap:10px; width:100%; min-height:64px;
  padding:11px 20px; border:0; border-radius:16px; background:var(--white); margin-bottom:14px;
}
.field:active{background:#F7F8F9}
.field .fl{flex:1; text-align:left; font-size:17px; font-weight:600; color:var(--t1)}
.field .fl small{display:block; font-size:14px; font-weight:500; color:var(--t3); margin-top:-2px}
.field .fv{font-size:17px; font-weight:700; color:var(--t1)}
.field .c{color:var(--t4); display:flex}

/* ───── 큰 숫자 입력 ───── */
.q{font-size:26px; font-weight:800; letter-spacing:-0.035em; line-height:1.35; margin:12px 0 6px}
/* 날짜 = 값의 맥락. 제목 바로 아래, 값보다 앞에, 값보다 가볍게 */
.dateline{margin:0 0 2px -10px}
.pill.static{color:var(--t2); font-weight:600; pointer-events:none}
.qs{font-size:15px; color:var(--t3); font-weight:500; min-height:22px; padding-left:2px}
.qs b{color:var(--t2); font-weight:600}
.bignum{
  display:flex; align-items:baseline; justify-content:center; gap:8px;
  width:100%; min-height:132px; padding:26px 0 22px; margin:14px 0 0;
  border-bottom:2px solid var(--press); cursor:text; transition:border-color .15s;
}
.bignum:focus-within{border-bottom-color:var(--blue)}
.bignum input{
  border:0; background:none; padding:0; margin:0; color:var(--t1);
  font:inherit; font-size:60px; font-weight:800; letter-spacing:-0.05em;
  font-variant-numeric:tabular-nums; text-align:right; outline:0; min-width:1ch;
}
.bignum input::placeholder{color:var(--t4)}
.bignum .unit{font-size:26px; font-weight:700; color:var(--t3)}
.bignum.empty .unit{color:var(--t4)}
.helper{text-align:center; color:var(--t3); font-size:15px; font-weight:500; min-height:22px; margin:16px 0 30px}
.helper b{color:var(--blue); font-weight:600}
.danger{
  display:block; margin:30px auto 0; border:0; background:none; font:inherit;
  color:var(--t3); font-size:15px; font-weight:500; text-decoration:underline; padding:10px;
}
[hidden]{display:none !important}   /* display 를 지정한 요소도 hidden 이면 확실히 감춘다 */
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}

/* ───── 일괄 입력 ───── */
.bsum{
  display:flex; align-items:baseline; justify-content:space-between;
  padding:6px 4px 18px; color:var(--t3); font-size:15px; font-weight:600;
}
.bsum b{color:var(--t1); font-size:20px; font-weight:800; font-variant-numeric:tabular-nums}
.brow{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.brow .bd{flex:1; font-size:16px; color:var(--t2); font-weight:500}
.brow .bd .tag{
  display:inline-block; margin-left:6px; padding:2px 7px; border-radius:6px;
  background:var(--blue-l); color:var(--blue); font-size:12px; font-weight:700; vertical-align:2px;
}
.brow input{
  width:92px; height:46px; padding:0 12px; border:1px solid #E5E8EB; border-radius:12px;
  background:var(--white); color:var(--t1); font:inherit; font-size:17px; font-weight:700;
  text-align:right; font-variant-numeric:tabular-nums; outline:0;
}
.brow input:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(49,130,246,.15)}
.brow.chg input{border-color:var(--blue); color:var(--blue)}
.brow .bu{font-size:15px; color:var(--t3); font-weight:500; width:14px}

/* ───── 하단 고정 버튼 ───── */
.cta{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  padding:14px 20px calc(22px + env(safe-area-inset-bottom));
  background:linear-gradient(to bottom, rgba(242,244,246,0) 0%, var(--bg) 32%);
  pointer-events:none;
}
.cta > div{max-width:480px; margin:0 auto; pointer-events:auto}
.btn{
  display:block; width:100%; height:56px; border:0; border-radius:14px;
  background:var(--blue); color:#fff; font:inherit; font-size:17px; font-weight:700;
}
.btn:active{background:var(--blue-d)}
.btn:disabled{background:var(--press); color:var(--t4); cursor:default}

/* ───── 바텀시트 ───── */
.dim{position:fixed; inset:0; z-index:45; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .24s}
.dim.on{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:50; max-width:480px; margin:0 auto;
  background:var(--white); border-radius:22px 22px 0 0;
  padding:6px 20px calc(10px + env(safe-area-inset-bottom));
  max-height:80vh; display:flex; flex-direction:column;
  transform:translateY(101%); transition:transform .26s cubic-bezier(.32,.72,0,1);
}
.sheet.on{transform:none}
.sheet .grip{width:40px; height:4px; border-radius:2px; background:var(--press); margin:8px auto 4px}
.sheet .shead{display:flex; align-items:center; padding:8px 0 6px}
.sheet .shead b{flex:1; font-size:19px; font-weight:700}
.sheet .x{
  width:40px; height:40px; border:0; background:none; color:var(--t3);
  display:flex; align-items:center; justify-content:center; border-radius:50%;
}
.sheet .x:active{background:var(--press)}
/* 시트 안을 끝까지 스크롤해도 뒤 화면이 따라 움직이지 않게 */
.slist{overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; margin:0 -4px}
.slist .row{padding:15px 4px}
.slist .row .l{color:var(--t1); font-weight:600}
.slist .row.sel .l, .slist .row.sel .r, .slist .row.sel .c{color:var(--blue)}
.slist .row .r{color:var(--t3); font-weight:500; font-size:16px; text-align:right}
.slist .row.sel .r{font-weight:700}
/* 금액은 건수 아래로 — 홈과 같은 위계, 좁은 화면에서도 줄이 접히지 않는다 */
.slist .row .r .sub{display:block; margin:-3px 0 0; font-size:14px; font-weight:500; color:var(--t3)}
.slist .row.sel .r .sub{color:var(--blue)}
.slist .row .c{width:18px; justify-content:flex-end; font-weight:700}
.slist .gh{
  position:sticky; top:0; background:var(--white); z-index:1;
  padding:14px 4px 6px; font-size:14px; font-weight:700; color:var(--t3);
}
.slist .gh span{font-weight:500; color:var(--t4); margin-left:5px}

/* left:50% + translateX(-50%) 로 가운데 두면, 이 요소가 레이아웃에서 쓸 수 있는
   폭이 화면의 절반으로 잘려 짧은 문장도 두 줄이 된다. left/right 를 함께 주고
   margin:auto 로 가운데 두면 화면 폭 전체를 기준으로 계산된다.
   아래 여백도 .cta 와 같은 안전영역 값을 더해야 저장 버튼을 덮지 않는다. */
/* ───── 로그인 문 ─────
   인증이 확인될 때까지 앱을 덮는다. 이미 로그인한 사람에게는 거의 보이지 않는다. */
.gate{
  position:fixed; inset:0; z-index:100; background:var(--bg);
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.gate.off{display:none}
.gbox{width:100%; max-width:340px; text-align:center}
.gicon{width:76px; height:76px; border-radius:22px; display:block; margin:0 auto 18px}
.gbox b{display:block; font-size:26px; font-weight:800; letter-spacing:-0.035em}
.gbox p{
  margin:10px 0 30px; font-size:15px; font-weight:500; color:var(--t3); line-height:1.6;
  min-height:48px;
}
.gbtn{
  display:flex; align-items:center; justify-content:center; gap:10px;
  background:var(--white); color:var(--t1); border:1px solid var(--line);
}
.gbtn:active{background:#F1F3F5}
.gbtn .glogo{display:flex}
.gretry, .gskip{display:block; margin:16px auto 0; font-size:15px; padding:8px}
.gskip{color:var(--t3)}

/* 동기화 상태 — 문제가 있을 때만 보인다 */
.sync{
  font-size:13px; font-weight:600; color:var(--t3); white-space:nowrap;
  padding:6px 10px; border-radius:8px; background:var(--press);
}
.sync[hidden]{display:none}

/* ───── 확인창 ─────
   기기 기본 confirm/alert 은 모양을 정할 수 없고 앱 밖의 것처럼 보인다.
   left:50% 대신 left/right + margin:auto 로 가운데를 잡는다(폭이 반으로 잘리지 않게). */
.mdim{
  position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.45);
  opacity:0; pointer-events:none; transition:opacity .18s;
}
.mdim.on{opacity:1; pointer-events:auto}
.modal{
  position:fixed; left:20px; right:20px; top:50%; margin:0 auto; z-index:71;
  max-width:340px; background:var(--white); border-radius:20px; padding:26px 22px 18px;
  text-align:center; opacity:0; pointer-events:none;
  transform:translateY(-46%) scale(.96);
  transition:opacity .18s, transform .18s cubic-bezier(.32,.72,0,1);
}
.modal.on{opacity:1; pointer-events:auto; transform:translateY(-50%) scale(1)}
.modal b{display:block; font-size:19px; font-weight:700; line-height:1.45}
.modal p{margin:10px 0 0; font-size:15px; font-weight:500; color:var(--t3); line-height:1.55}
.modal .mbtns{display:flex; gap:8px; margin-top:22px}
.modal .mbtns button{
  flex:1; height:52px; border:0; border-radius:14px; font:inherit;
  font-size:16px; font-weight:700; letter-spacing:-0.02em;
}
.modal .mno{background:var(--press); color:var(--t2)}
.modal .mno:active{background:#DCE0E5}
.modal .myes{background:var(--blue); color:#fff}
.modal .myes:active{background:var(--blue-d)}
.modal .myes.danger{background:var(--red)}
.modal .myes.danger:active{background:#D22F25}

/* ───── 숫자 키패드 ─────
   기기 기본 키보드는 크기·모양을 정할 수 없어 화면과 따로 노는 느낌이 난다.
   숫자만 넣는 화면이라 직접 만든 키패드를 항상 띄워 둔다(누를 필요 없음). */
.pad{
  position:fixed; left:0; right:0; bottom:0; z-index:30; display:none;
  background:var(--bg); padding:4px 8px calc(6px + env(safe-area-inset-bottom));
}
.pad.on{display:block}
.pad .grid{max-width:480px; margin:0 auto; display:grid; grid-template-columns:repeat(3,1fr); gap:2px}
.pad button{
  height:56px; border:0; background:none; border-radius:12px; color:var(--t1);
  font:inherit; font-size:27px; font-weight:600; letter-spacing:-0.02em;
  display:flex; align-items:center; justify-content:center;
}
.pad button:active{background:var(--press)}
.pad button.del{color:var(--t2)}
/* 키패드가 떠 있는 동안 저장 버튼과 내용이 가려지지 않게 밀어 올린다 */
body.pad-on .cta{bottom:var(--padH, 250px)}
body.pad-on .app{padding-bottom:calc(var(--padH, 250px) + 110px)}
@media (max-height:700px){
  .pad button{height:48px; font-size:24px}
  .bignum{min-height:108px; padding:14px 0 12px; margin-top:8px}
  .q{font-size:23px}
}

.toast{
  position:fixed; left:16px; right:16px; margin:0 auto;
  bottom:calc(104px + env(safe-area-inset-bottom)); z-index:60;
  /* 100% 는 뷰포트 폭으로 해석되므로 좌우 여백을 직접 빼야 화면에 딱 붙지 않는다 */
  width:max-content; max-width:min(360px, calc(100% - 32px));
  padding:14px 20px; border-radius:14px;
  background:rgba(25,31,40,.94); color:#fff; font-size:16px; font-weight:600; line-height:1.45;
  transform:translateY(14px);
  opacity:0; transition:opacity .22s, transform .22s; pointer-events:none; text-align:center;
}
.toast.on{opacity:1; transform:translateY(0)}
.note{color:var(--t3); font-size:14px; font-weight:500; line-height:1.6; padding:4px 4px 20px}
.note b{color:var(--t2)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 4.5 7.5 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-caret" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>

<script>
const pad = n => String(n).padStart(2,'0');
const fmt = n => (n||0).toLocaleString('ko-KR');
const DOW = ['일','월','화','수','목','금','토'];
const $ = id => document.getElementById(id);
const ico = (id, s) => `<svg width="${s}" height="${s}"><use href="#i-${id}"/></svg>`;

let db = { daily:{}, rates:{} };   // 서버에서 받아온 기록. 기기에는 저장하지 않는다
let cursor;          // 홈에서 보고 있는 정산월 'YYYY-MM' (26일 시작월)
let editDate;        // 입력/수정 화면의 날짜
let editMode;        // 'new' = 기록하기(날짜 변경 가능) / 'edit' = 목록에서 들어온 수정
let bulkKey;         // 일괄 입력 화면의 정산월
let bulkDraft = {};  // 일괄 입력 중인 값 {날짜: '문자열'}
let rateDate;        // 단가를 적용할 시작일
let sheetMode;       // 'month-home' | 'month-bulk' | 'date' | 'date-rate'
let curView = 'home';
let sheetOn = false;
let padTarget = null;   // 키패드가 값을 넣을 입력칸
let padFresh = false;   // 아직 손대지 않은 값 — 첫 숫자를 누르면 대체된다
let modalOn = false, askResolve = null, askResult = false;   // 확인창
let afterBack = null;   // 뒤로가기가 끝난 뒤 이어서 할 일 (시트에서 값을 고른 경우)
let toastTimer = null;

/* ══════════ 저장은 계정에만 ══════════
   기기에는 저장하지 않는다. 로그인해야 쓸 수 있고, 기록은 계정에만 남는다.
   · 값을 바꿀 때: 바뀐 날짜만 서버로 올린다(통째로 덮어쓰지 않아 다른 날을 잃지 않는다)
   · 서버가 바뀌면 화면이 따라 바뀐다(다른 기기에서 지운 것도 따라 지워진다)
   Firestore 자체 캐시를 켜 두었기 때문에, 한 번 로그인한 뒤에는 인터넷이 끊겨도
   읽고 쓸 수 있고 연결되면 자동으로 올라간다. */
const shape = o => ({ daily: (o && o.daily) || {}, rates: (o && o.rates) || {} });

const FB = {
  apiKey: "AIzaSyBg5ccH49HpSaKewLF_376ysjnFDR2Jfks",
  authDomain: "monthly-b6382.firebaseapp.com",
  projectId: "monthly-b6382",
  storageBucket: "monthly-b6382.firebasestorage.app",
  messagingSenderId: "1027738806080",
  appId: "1:1027738806080:web:bb7ed9e84262c482eabca5"
};
const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
let api = null, fbAuth = null, fbStore = null, fbUser = null, unwatch = null;

const userRef = () => api.doc(fbStore, 'users', fbUser.uid);

async function startCloud(){
  try{
    const [a, b, c] = await Promise.all([
      import(SDK + 'firebase-app.js'),
      import(SDK + 'firebase-auth.js'),
      import(SDK + 'firebase-firestore.js'),
    ]);
    api = Object.assign({}, b, c);
    const app = a.initializeApp(FB);
    fbAuth = b.getAuth(app);
    // 오프라인에서도 읽고, 오프라인에서 쓴 것은 쌓아두었다가 나중에 올린다
    fbStore = c.initializeFirestore(app, { localCache: c.persistentLocalCache({}) });
    b.onAuthStateChanged(fbAuth, onUser);
  }catch(err){
    gate('net', err);        // SDK 를 못 받으면 쓸 수 없다 (저장할 곳이 계정뿐이므로)
  }
}

function gate(mode, err){
  const g = $('gate'), msg = $('gMsg');
  g.classList.remove('off');
  $('btnLogin').hidden = mode !== 'signin' && mode !== 'fail';
  $('btnRetry').hidden = mode !== 'net';
  if (mode === 'wait')   msg.innerHTML = '잠시만요…';
  if (mode === 'signin') msg.innerHTML = '배달 실적을 구글 계정에 저장해요.<br>기기를 바꾸거나 앱을 지워도 기록이 남습니다.';
  if (mode === 'net')    msg.innerHTML = '인터넷에 연결되지 않았어요.<br>연결한 뒤 다시 시도해 주세요.';
  if (mode === 'fail')   msg.innerHTML = `로그인하지 못했어요.<br><span style="font-size:13px">${(err && err.code) || ''}</span>`;
}
function enterApp(){
  $('gate').classList.add('off');
  cursor = cycleKeyOf(todayStr());
  show('home');
  renderHome();
  renderAccount();
  replaceNav();       // 홈을 히스토리의 뿌리로 (여기서 뒤로가면 앱이 닫힌다)
}

function onUser(u){
  fbUser = u;
  if (unwatch){ unwatch(); unwatch = null; }
  if (!u){
    db = { daily:{}, rates:{} };      // 남의 기록이 화면에 남지 않게 비운다
    gate('signin');
    return;
  }
  gate('wait');
  watchCloud();                       // 첫 응답이 오면 문을 닫는다
}

/* 서버가 유일한 원본. 다른 기기에서 지운 것도 따라 지워진다 */
function watchCloud(){
  let first = true;
  unwatch = api.onSnapshot(userRef(), snap => {
    db = shape(snap.exists() ? snap.data() : null);
    setSync(snap.metadata);
    if (first){ first = false; enterApp(); return; }
    renderHome();
    renderAccount();
    // 입력 중인 화면은 건드리지 않는다. 일괄 입력은 고치던 값이 없을 때만 다시 그린다
    if (curView === 'bulk' && !changedDates().length) renderBulk();
  }, err => {
    console.warn('동기화 끊김', err);
    setSync(null, err);
    if (first){ first = false; enterApp(); }   // 못 읽어도 앱은 열어준다
  });
}

/* 바뀐 날짜만 올린다 */
function cloudWrite(patch){
  if (!fbUser || !api) return;
  api.setDoc(userRef(), patch, { merge:true }).catch(e => console.warn('올리기 실패', e));
}
/* 통째로 바꿀 때(전체 삭제)는 merge 를 쓰면 옛 날짜가 남는다 */
function cloudReplace(){
  if (!fbUser || !api) return;
  api.setDoc(userRef(), { daily: db.daily, rates: db.rates })
     .catch(e => console.warn('올리기 실패', e));
}
const gone = () => api.deleteField();

function setSync(meta, err){
  const chip = $('sync');
  let text = '';
  if (err) text = '동기화 안 됨';
  else if (meta && meta.hasPendingWrites) text = '저장 중…';
  else if (meta && meta.fromCache) text = '오프라인';
  chip.textContent = text;
  chip.hidden = !text;
  const s = $('acctSync');
  if (s) s.textContent = text || '최신 상태';
}

function renderAccount(){
  const mail = $('acctMail');
  if (!mail) return;
  mail.textContent = fbUser ? (fbUser.email || fbUser.displayName || '로그인됨') : '-';
  $('btnLogout').hidden = !fbUser;
}

/* ── 날짜 ── */
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function addDays(s, n){
  const [y,m,d] = s.split('-').map(Number);
  const t = new Date(Date.UTC(y,m-1,d));
  t.setUTCDate(t.getUTCDate()+n);
  return `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(t.getUTCDate())}`;
}
const dowOf = s => { const [y,m,d]=s.split('-').map(Number);
                     return new Date(Date.UTC(y,m-1,d)).getUTCDay(); };
const mdText = s => `${Number(s.slice(5,7))}월 ${Number(s.slice(8,10))}일`;
const mdDow  = s => `${mdText(s)} (${DOW[dowOf(s)]})`;
/* 올해가 아니면 연도까지 붙인다 */
const ymText = s => (s.slice(0,4) === todayStr().slice(0,4) ? '' : `${Number(s.slice(0,4))}년 `) + mdText(s);
/* 오늘·어제는 말로 부른다 */
function dayWord(s){
  const t = todayStr();
  if (s === t) return '오늘';
  if (s === addDays(t,-1)) return '어제';
  return mdText(s);
}

/* 26일부터 다음달 25일까지. 기간이 '끝나는 달'이 정산월
   예) 7월 26일 ~ 8월 25일 = 8월 */
function cycleKeyOf(s){
  const [y,m,d] = s.split('-').map(Number);
  if (d >= 26) return m === 12 ? `${y+1}-01` : `${y}-${pad(m+1)}`;
  return `${y}-${pad(m)}`;
}
function shiftKey(k, delta){
  let [y,m] = k.split('-').map(Number);
  m += delta; y += Math.floor((m-1)/12); m = ((m-1)%12+12)%12 + 1;
  return `${y}-${pad(m)}`;
}
function cycleDates(k){
  const [y,m] = k.split('-').map(Number);
  const sy = m === 1 ? y-1 : y, sm = m === 1 ? 12 : m-1;
  const end = `${y}-${pad(m)}-25`;
  const out = []; let cur = `${sy}-${pad(sm)}-26`;
  while (cur <= end){ out.push(cur); cur = addDays(cur,1); }
  return out;
}
const cycleTitle = k => `${k.slice(0,4)}년 ${Number(k.slice(5,7))}월`;
function cycleRange(k){
  const ds = cycleDates(k);
  return `${mdText(ds[0])} ~ ${mdText(ds[ds.length-1])}`;
}

/* ── 단가: '그 날부터 계속' 이라는 뜻으로 저장한다 ──
   db.rates = { '2026-07-26': 1500 }  →  7월 26일부터 다음 변경 전까지 1,500원
   FIRST 는 '처음부터'. 첫 단가는 이 값으로 두어야, 나중에 과거 실적을 채워도
   금액이 빠지지 않는다. */
const FIRST = '1900-01-01';
const rateFrom = k => k === FIRST ? '처음부터' : `${ymText(k)}부터`;
function rateStart(d){                       // 그 날에 적용되는 단가의 시작일
  let best = '';
  for (const k in db.rates) if (k <= d && k > best) best = k;
  return best || null;
}
const rateOn = d => { const s = rateStart(d); return s ? db.rates[s] : 0; };
function ratesInCycle(k){                    // 이 정산 기간에 적용된 단가들
  const map = new Map();
  for (const d of cycleDates(k)){
    const r = rateOn(d);
    if (r) map.set(r, map.get(r) ?? d);
  }
  return map;
}
/* 금액은 날짜마다 그 날의 단가로 계산한다 (기간 중에 바뀌어도 맞게 나온다) */
function summary(k, rates){
  const R = rates || db.rates;
  const rateAt = d => { let b=''; for (const x in R) if (x <= d && x > b) b = x; return b ? R[b] : 0; };
  let count = 0, amount = 0; const rows = [];
  for (const d of cycleDates(k)){
    const v = db.daily[d];
    if (v === undefined) continue;
    const r = rateAt(d);
    count += v; amount += v * r;
    rows.push([d, v, r]);
  }
  return { count, amount, rows };
}

/* ── 화면 이동 ──
   안드로이드 시스템 뒤로가기는 브라우저 히스토리를 따라간다. 그래서 화면을
   보여주고 감추는 것만으로는 안 되고, 화면마다 히스토리 항목을 쌓아야
   뒤로가기가 홈까지 되돌아온 다음 앱을 닫는다.
   히스토리 항목에는 그 화면을 되살릴 정보를 스냅샷으로 담는다(값의 차이가
   아니라 상태 그대로). cursor(보고 있는 달)는 화면 이동이 아니라 필터이므로
   스냅샷에 넣지 않는다. */
function show(v){
  curView = v;
  document.querySelectorAll('.view').forEach(e => e.classList.toggle('on', e.id === 'v'+'-'+v));
  window.scrollTo(0,0);
  // 숫자 하나만 넣는 화면에서는 직접 만든 키패드를 띄운다
  padTarget = v === 'entry' ? $('count') : v === 'price' ? $('price') : null;
  padFresh = !!(padTarget && padTarget.value);   // 채워진 값은 첫 숫자에 대체된다
  showPad(!!padTarget);
}
function showPad(on){
  $('pad').classList.toggle('on', on);
  document.body.classList.toggle('pad-on', on);
  if (on){
    // 저장 버튼을 밀어 올릴 만큼의 높이를 실제로 재서 알려준다
    const h = Math.round($('pad').getBoundingClientRect().height);
    if (h) document.documentElement.style.setProperty('--padH', h + 'px');
  }
}
/* 키패드 입력
   - 이미 값이 있는 칸에 들어와 처음 누르는 숫자는 기존 값을 '대체'한다.
     고치러 들어온 것이 대부분이라, 뒤에 붙으면 ⌫ 를 여러 번 눌러야 한다
   - 앞자리 0 이 쌓이지 않게, 7자리를 넘지 않게 막는다 */
function padPress(k){
  const el = padTarget;
  if (!el) return;
  let v = el.value;
  if (k === 'del'){
    v = v.slice(0, -1);
    padFresh = false;
  } else {
    if (padFresh){ v = ''; padFresh = false; }
    if (v.length + k.length <= 7) v = (v === '0' ? '' : v) + k;
  }
  el.value = v.replace(/^0+(?=\d)/, '');
  el.dispatchEvent(new Event('input', { bubbles:true }));
}
const depthNow = () => (history.state && history.state.depth) || 0;
const snap = depth => ({ depth, view:curView, sheet: sheetOn ? sheetMode : null,
                         modal: modalOn, editDate, editMode, bulkKey, rateDate });
const pushNav    = () => history.pushState(snap(depthNow()+1), '');
const replaceNav = () => history.replaceState(snap(depthNow()), '');
/* 저장을 마쳤으면 홈까지 한 번에 되돌린다 (뒤로가기로 입력 화면에 되돌아가지 않게) */
function goHome(){
  const d = depthNow();
  if (d > 0) history.go(-d);          // popstate 가 홈 상태를 되살린다
  else { show('home'); renderHome(); replaceNav(); }
}
/* ── 확인창 ──
   기기 기본 confirm/alert 을 대신한다. 시스템 뒤로가기로 닫으면 '취소' 로 본다.
   그래서 시트와 같은 방식으로 히스토리에 한 단계를 쌓는다. */
function ask(opt){
  $('mTitle').textContent = opt.title;
  $('mBody').textContent = opt.body || '';
  $('mBody').hidden = !opt.body;
  $('mYes').textContent = opt.ok || '확인';
  $('mYes').classList.toggle('danger', !!opt.danger);
  $('mNo').hidden = !!opt.alone;
  $('mNo').textContent = opt.cancel || '취소';
  modalOn = true; askResult = false;
  $('mdim').classList.add('on');
  $('modal').classList.add('on');
  pushNav();
  return new Promise(r => { askResolve = r; });
}
const tell = (title, body) => ask({ title, body, alone:true });
function closeAsk(v){ askResult = v; history.back(); }   // 실제로 닫는 것은 popstate
function hideAsk(){
  modalOn = false;
  $('mdim').classList.remove('on');
  $('modal').classList.remove('on');
}

function toast(msg){
  const el = $('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2200);
}

/* ─────────── 홈 ─────────── */
function renderHome(){
  const today = todayStr();
  const s = summary(cursor);
  const isThis = cursor === cycleKeyOf(today);

  $('mName').textContent  = cycleTitle(cursor);
  $('heroCap').textContent = `${cycleRange(cursor)} 정산`;

  // 주인공은 늘 건수. 금액은 단가가 있을 때 그 아래에 붙는 파생값
  $('heroBig').innerHTML = `${fmt(s.count)}<em>건</em>`;
  $('heroMoney').hidden = s.amount === 0;
  if (s.amount) $('heroMoney').innerHTML = `${fmt(s.amount)}<em>원</em>`;

  // 단가 줄 — 언제부터 적용 중인지를 보여준다 (달에 묶인 값이 아니다)
  const inCycle = ratesInCycle(cursor);
  const ds = cycleDates(cursor);
  const refDay = today < ds[ds.length-1] ? today : ds[ds.length-1];
  const nowRate = rateOn(refDay);
  if (!nowRate && inCycle.size === 0){
    $('priceValue').textContent = '입력하기';
    $('priceScope').textContent = '넣으면 바꿀 때까지 계속 적용돼요';
  } else {
    // 값은 '지금 적용 중인 단가' 하나만. 기간 중에 바뀌었으면 그것만 덧붙인다
    $('priceValue').textContent = `${fmt(nowRate)}원`;
    const st = rateStart(refDay);
    $('priceScope').textContent = (st ? rateFrom(st) : '')
      + (inCycle.size > 1 ? ' · 기간 중 바뀜' : ' 적용 중');
  }
  $('priceValue').style.color = nowRate ? 'var(--t1)' : 'var(--blue)';

  $('listHead').textContent = s.rows.length ? `기록한 날 ${s.rows.length}일` : '기록';
  const list = $('list');
  list.innerHTML = '';

  // 이번 달을 보고 있는데 오늘이 비어 있으면 맨 위에 알려준다
  if (isThis && db.daily[today] === undefined){
    const b = document.createElement('button');
    b.className = 'row';
    b.innerHTML = `<span class="l">${mdDow(today)}<span class="tag">오늘</span></span>` +
                  `<span class="r" style="color:var(--t4); font-weight:500; font-size:16px">기록 없음</span>` +
                  `<span class="c">${ico('next',20)}</span>`;
    b.onclick = () => openEntry(today, 'new');
    list.appendChild(b);
  }
  if (!s.rows.length && !(isThis && db.daily[today] === undefined)){
    list.innerHTML = `<div class="blank">아직 기록이 없어요</div>`;
  }
  for (const [d,v] of s.rows.slice().reverse()){
    const b = document.createElement('button');
    b.className = 'row';
    b.innerHTML = `<span class="l">${mdDow(d)}${d===today?'<span class="tag">오늘</span>':''}</span>` +
                  `<span class="r">${fmt(v)}<small>건</small></span>` +
                  `<span class="c">${ico('next',20)}</span>`;
    b.onclick = () => openEntry(d, 'edit');   // 수정은 이 목록에서만 들어온다
    list.appendChild(b);
  }
}

/* ─────────── 입력 / 수정 ─────────── */
function setEntry(d, mode){
  editDate = d; editMode = mode;
  const v = db.daily[d];
  $('count').value = v === undefined ? '' : v;
  show('entry');
  renderEntry();
  setTimeout(() => $('count').focus(), 60);
}
function openEntry(d, mode){ setEntry(d, mode); pushNav(); }
function renderEntry(){
  const d = editDate, known = db.daily[d];
  const isEdit = editMode === 'edit';

  $('eQ').textContent = isEdit ? `${dayWord(d)} 실적 수정` : `${dayWord(d)} 건수를 입력해주세요`;

  // 날짜: 수정은 그 날짜로 고정(글자만), 기록하기는 눌러서 고를 수 있다(알약)
  $('dLabel').textContent = mdDow(d);
  $('dateField').classList.toggle('static', isEdit);
  $('dCaret').style.display = isEdit ? 'none' : 'flex';
  $('dateField').disabled = isEdit;

  // 맥락 줄: 다른 날 기록을 덮어쓰게 되는 경우에만 알려준다
  $('eQS').innerHTML = (!isEdit && known !== undefined)
    ? `이미 <b>${fmt(known)}건</b>으로 기록되어 있어요. 저장하면 바뀌어요`
    : '';
  $('btnDel').hidden = !(isEdit && known !== undefined);
  $('btnBulk').hidden = isEdit;   // 여러 날 입력은 '기록하기'에서만

  sizeNum($('count'), $('numBox'));
  const raw = $('count').value.trim(), n = Number(raw);
  const ok = raw !== '' && isFinite(n) && n >= 0;
  $('ctaSave').disabled = !ok;
  $('ctaSave').textContent = isEdit ? '수정 저장하기' : '저장하기';
  const rate = rateOn(d);
  $('eHelp').innerHTML = ok && rate ? `이 날 <b>${fmt(Math.floor(n)*rate)}원</b>` : '';
}
function sizeNum(input, box){
  input.style.width = Math.max(1, (input.value||'').replace('-','').length) + 'ch';
  box.classList.toggle('empty', !input.value);
}

/* ─────────── 여러 날 한꺼번에 입력 ─────────── */
function openBulk(){
  // 기록하기에서 들어오므로, 지금 다루던 날짜가 속한 달로 시작한다
  bulkKey = editDate ? cycleKeyOf(editDate) : cursor;
  bulkDraft = {};
  show('bulk'); renderBulk(); pushNav();
}
function renderBulk(){
  const today = todayStr();
  const days = cycleDates(bulkKey).filter(d => d <= today).reverse();
  $('bName').textContent = cycleTitle(bulkKey);
  $('bRange').textContent = cycleRange(bulkKey);

  const box = $('bulkList');
  box.innerHTML = '';
  if (!days.length){
    box.innerHTML = `<div class="blank">아직 시작하지 않은 달이에요</div>`;
  }
  for (const d of days){
    const cur = bulkDraft[d] !== undefined ? bulkDraft[d]
              : (db.daily[d] === undefined ? '' : String(db.daily[d]));
    const el = document.createElement('div');
    el.className = 'brow' + (isChanged(d) ? ' chg' : '');
    el.innerHTML = `<span class="bd">${mdDow(d)}${d===today?'<span class="tag">오늘</span>':''}</span>` +
      `<input type="text" inputmode="none" readonly autocomplete="off" placeholder="-" data-d="${d}" value="${cur}">` +
      `<span class="bu">건</span>`;
    box.appendChild(el);
  }
  updateBulkSummary();
}
function storedStr(d){ return db.daily[d] === undefined ? '' : String(db.daily[d]); }
function isChanged(d){
  if (bulkDraft[d] === undefined) return false;
  const a = bulkDraft[d].trim(), b = storedStr(d);
  if (a === '' && b === '') return false;
  return a === '' ? true : String(Math.max(0, Math.floor(Number(a)))) !== b;
}
function changedDates(){ return Object.keys(bulkDraft).filter(isChanged); }
function updateBulkSummary(){
  // 합계는 저장 전 입력값을 반영해서 보여준다
  let total = 0;
  for (const d of cycleDates(bulkKey)){
    const raw = bulkDraft[d] !== undefined ? bulkDraft[d].trim() : storedStr(d);
    if (raw === '') continue;
    const n = Math.floor(Number(raw));
    if (isFinite(n)) total += Math.max(0, n);
  }
  $('bTotal').textContent = fmt(total);
  const n = changedDates().length;
  $('ctaBulk').disabled = n === 0;
  $('ctaBulk').textContent = n ? `${n}일 저장하기` : '저장하기';
}

/* ─────────── 단가 (그 날부터 계속) ─────────── */
function openPrice(){
  // 첫 단가는 '처음부터'(가진 기록 전부 + 나중에 채울 과거 기록까지)
  // 두 번째부터는 '오늘부터' 바꾸는 것이 보통이다
  rateDate = Object.keys(db.rates).length ? todayStr() : FIRST;
  $('price').value = '';
  show('price'); renderPrice(); pushNav();
  setTimeout(() => $('price').focus(), 60);
}
function renderPrice(){
  $('rateDateLabel').textContent = rateDate === FIRST ? '처음부터' : `${mdDow(rateDate)}부터`;
  $('pQS').textContent = rateDate === FIRST
    ? '모든 기록에 적용돼요. 나중에 바꾸면 그 날부터 새 단가예요'
    : '이 날부터 바꿀 때까지 계속 적용돼요';
  sizeNum($('price'), $('pBox'));
  const raw = $('price').value.trim(), n = Math.floor(Number(raw));
  const ok = raw !== '' && isFinite(n) && n >= 0;
  $('ctaPrice').disabled = !ok;

  // 이 단가를 넣으면 지금 보고 있는 정산월 금액이 어떻게 되는지
  if (ok){
    const after = summary(cursor, { ...db.rates, [rateDate]: n });
    $('pHelp').innerHTML = after.count
      ? `${cycleTitle(cursor)} ${fmt(after.count)}건 → <b>${fmt(after.amount)}원</b>`
      : '';
  } else $('pHelp').innerHTML = '';

  // 바뀐 단가 이력 — 언제부터 무엇이 적용됐는지 한눈에
  const keys = Object.keys(db.rates).sort().reverse();
  $('rateHistory').hidden = !keys.length;
  const box = $('rateList');
  box.innerHTML = '';
  for (const k of keys){
    const el = document.createElement('div');
    el.className = 'row';
    el.innerHTML = `<span class="l">${rateFrom(k)}</span>` +
                   `<span class="r">${fmt(db.rates[k])}<small>원</small></span>` +
                   `<button class="txtdel" data-k="${k}">삭제</button>`;
    box.appendChild(el);
  }
}

/* ─────────── 선택 시트 ─────────── */
function openSheet(mode){
  sheetMode = mode; sheetOn = true;
  renderSheet();
  $('dim').classList.add('on');
  $('sheet').classList.add('on');
  pushNav();                     // 시트도 한 단계 — 뒤로가기로 닫힌다
}
function hideSheet(){            // 화면만 닫는다 (히스토리는 건드리지 않음)
  sheetOn = false;
  $('dim').classList.remove('on');
  $('sheet').classList.remove('on');
}
/* 시트에서 값을 고른 경우: 시트 단계를 히스토리에서 걷어낸 뒤 이어서 처리한다.
   그래야 값을 고르고 나서 뒤로가기 한 번에 앞 화면으로 나간다. */
function closeSheetThen(fn){
  hideSheet();
  afterBack = fn;
  history.back();
}
function renderSheet(){
  const today = todayStr();
  const box = $('sList');
  box.innerHTML = '';

  if (sheetMode === 'date' || sheetMode === 'date-rate'){
    const forRate = sheetMode === 'date-rate';
    const selDate = forRate ? rateDate : editDate;
    $('sTitle').textContent = forRate ? '언제부터 적용할까요?' : '날짜 선택';
    if (forRate){
      // 가진 기록 전체(앞으로 채울 과거 기록까지)에 적용하는 선택지
      const b = document.createElement('button');
      b.className = 'row' + (rateDate === FIRST ? ' sel' : '');
      b.innerHTML = `<span class="l">처음부터</span>` +
        `<span class="r">모든 기록에 적용</span>` +
        `<span class="c">${rateDate === FIRST ? ico('check',18) : ''}</span>`;
      b.onclick = () => closeSheetThen(() => { rateDate = FIRST; renderPrice(); replaceNav(); });
      box.appendChild(b);
    }
    // 오늘부터 60일 전까지, 정산월로 묶어서 보여준다
    let lastKey = null;
    for (let i = 0; i < 60; i++){
      const d = addDays(today, -i);
      const k = cycleKeyOf(d);
      if (k !== lastKey){
        lastKey = k;
        const h = document.createElement('div');
        h.className = 'gh';
        h.innerHTML = `${cycleTitle(k)} <span>${cycleRange(k)} 정산</span>`;
        box.appendChild(h);
      }
      const v = db.daily[d];
      const b = document.createElement('button');
      b.className = 'row' + (d === selDate ? ' sel' : '');
      b.innerHTML = `<span class="l">${mdDow(d)}${d===today?'<span class="tag">오늘</span>':''}</span>` +
        `<span class="r">${forRate ? (rateOn(d) ? fmt(rateOn(d))+'원' : '단가 없음')
                                   : (v === undefined ? '기록 없음' : fmt(v)+'건')}</span>` +
        `<span class="c">${d === selDate ? ico('check',18) : ''}</span>`;
      b.onclick = () => closeSheetThen(() => {
        if (forRate){ rateDate = d; renderPrice(); }
        else setEntry(d, editMode);
        replaceNav();
      });
      box.appendChild(b);
    }
  } else {
    const forBulk = sheetMode === 'month-bulk';
    const sel = forBulk ? bulkKey : cursor;
    $('sTitle').textContent = '월 선택';
    // 기록이 있는 달 + 최근 6개 정산월
    const keys = new Set(Object.keys(db.daily).map(cycleKeyOf));
    const now = cycleKeyOf(today);
    for (let i = 0; i < 6; i++) keys.add(shiftKey(now, -i));
    keys.add(sel);
    for (const k of [...keys].sort().reverse()){
      const s = summary(k);
      const b = document.createElement('button');
      b.className = 'row' + (k === sel ? ' sel' : '');
      b.innerHTML = `<span class="l">${cycleTitle(k)}${k===now?'<span class="tag">이번 달</span>':''}</span>` +
        `<span class="r">${s.count ? fmt(s.count)+'건' : '기록 없음'}` +
        `${s.amount ? `<small class="sub">${fmt(s.amount)}원</small>` : ''}</span>` +
        `<span class="c">${k === sel ? ico('check',18) : ''}</span>`;
      b.onclick = () => closeSheetThen(() => {
        if (forBulk){ bulkKey = k; cursor = k; bulkDraft = {}; renderBulk(); renderHome(); }
        else { cursor = k; renderHome(); }
        replaceNav();
      });
      box.appendChild(b);
    }
  }
  const s = box.querySelector('.sel');
  if (s) box.scrollTop = Math.max(0, s.offsetTop - 90);
}

$('monthPill').onclick = () => openSheet('month-home');
$('bulkPill').onclick = () => openSheet('month-bulk');

$('btnPriceField').onclick = openPrice;
$('btnMore').onclick = () => { renderAccount(); show('more'); pushNav(); };

/* 화면 안의 뒤로가기 버튼도 시스템 뒤로가기와 똑같이 동작해야 한다 */
document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => history.back());
$('dim').onclick = () => history.back();
$('sClose').onclick = () => history.back();
document.addEventListener('keydown', e => {
  if (modalOn){
    if (e.key === 'Escape') closeAsk(false);
    if (e.key === 'Enter')  closeAsk(true);
    return;
  }
  if (e.key === 'Escape' && sheetOn) history.back();
});

/* 시스템 뒤로가기 — 히스토리에 담아둔 스냅샷으로 그 화면을 되살린다.
   홈(depth 0)에서 한 번 더 누르면 앱이 닫힌다 */
window.addEventListener('popstate', e => {
  const s = e.state || { view:'home', sheet:null };

  // 확인창이 열려 있었는데 돌아온 자리에 없으면 닫고 결과를 넘긴다(뒤로가기 = 취소)
  let settle = null;
  if (!s.modal && modalOn){
    hideAsk();
    const r = askResolve, v = askResult;
    askResolve = null; askResult = false;
    if (r) settle = () => r(v);
  }

  if (s.sheet){
    sheetMode = s.sheet; sheetOn = true;
    renderSheet();
    $('dim').classList.add('on'); $('sheet').classList.add('on');
  } else hideSheet();

  const v = s.view || 'home';
  if (v === 'entry'){
    // 입력 중이던 값은 살린다. 다른 날짜로 돌아가는 경우에만 다시 불러온다
    if (editDate !== s.editDate || editMode !== s.editMode){
      editDate = s.editDate; editMode = s.editMode;
      const val = db.daily[editDate];
      $('count').value = val === undefined ? '' : val;
    }
    show('entry'); renderEntry();
  } else if (v === 'bulk'){
    if (bulkKey !== s.bulkKey){ bulkKey = s.bulkKey; bulkDraft = {}; }
    show('bulk'); renderBulk();
  } else if (v === 'price'){
    rateDate = s.rateDate;
    show('price'); renderPrice();
  } else if (v === 'more'){
    show('more');
  } else {
    show('home'); renderHome();
  }

  if (afterBack){ const f = afterBack; afterBack = null; f(); }
  // popstate 안에서 또 history 를 건드리면 꼬이므로 한 틱 뒤에 넘긴다
  if (settle) setTimeout(settle, 0);
});

$('mYes').onclick = () => closeAsk(true);
$('mNo').onclick  = () => closeAsk(false);
$('mdim').onclick = () => closeAsk(false);

/* 키패드: mousedown 에서 막아야 입력칸의 포커스(커서)가 유지된다 */
$('pad').addEventListener('mousedown', e => e.preventDefault());
$('pad').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]');
  if (b) padPress(b.dataset.k);
});

/* PC 물리 키보드도 키패드와 같은 길로 처리한다.
   입력칸이 readonly 라서 직접 타이핑은 들어오지 않기 때문 */
document.addEventListener('keydown', e => {
  if (!padTarget || sheetOn || modalOn || e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.key >= '0' && e.key <= '9'){ padPress(e.key); e.preventDefault(); return; }
  if (e.key === 'Backspace'){ padPress('del'); e.preventDefault(); return; }
  if (e.key === 'Enter'){
    const cta = curView === 'entry' ? $('ctaSave')
              : curView === 'price' ? $('ctaPrice')
              : curView === 'bulk'  ? $('ctaBulk') : null;
    if (cta && !cta.disabled) cta.click();
    e.preventDefault();
  }
});

$('count').oninput = renderEntry;
$('dateField').onclick = () => { if (editMode !== 'edit') openSheet('date'); };

$('ctaSave').onclick = () => {
  const n = Math.max(0, Math.floor(Number($('count').value)));
  const isEdit = editMode === 'edit';
  db.daily[editDate] = n;
  cloudWrite({ daily: { [editDate]: n } });
  cursor = cycleKeyOf(editDate);
  goHome();
  toast(`${dayWord(editDate)} ${fmt(n)}건 ${isEdit ? '수정했어요' : '저장했어요'}`);
};
$('btnDel').onclick = async () => {
  const ok = await ask({ title:`${mdText(editDate)} 기록을 지울까요?`,
                         body:`${fmt(db.daily[editDate])}건이 없어지고 그 달 합계에서 빠져요.`,
                         ok:'삭제', danger:true });
  if (!ok) return;
  delete db.daily[editDate];
  cloudWrite({ daily: { [editDate]: gone() } });
  goHome();
  toast(`${dayWord(editDate)} 기록을 지웠어요`);
};

/* 일괄 입력은 칸이 많으니, 누른 칸에 키패드를 붙였다가 벗어나면 내린다.
   기기에 따라 readonly 칸의 포커스 동작이 달라서 focusin 과 click 양쪽에 걸어둔다 */
function bulkPick(el){
  if (!el || el.tagName !== 'INPUT') return;
  if (padTarget === el) return;                  // 같은 칸을 다시 눌렀으면 대체 상태를 되살리지 않는다
  padTarget = el;
  padFresh = !!el.value;
  showPad(true);
  // 키패드에 가려지지 않게 그 줄을 끌어올린다
  const padH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--padH')) || 240;
  const limit = window.innerHeight - padH - 96;
  const b = el.getBoundingClientRect();
  if (b.bottom > limit) window.scrollBy({ top: b.bottom - limit + 12, behavior:'smooth' });
}
$('bulkList').addEventListener('focusin', e => bulkPick(e.target));
$('bulkList').addEventListener('click', e => bulkPick(e.target));
$('bulkList').addEventListener('focusout', () => {
  // 키패드를 누르는 동안에는 포커스가 유지되므로(mousedown 차단) 여기서 내려도 안전하다
  if (curView === 'bulk'){ padTarget = null; showPad(false); }
});

$('bulkList').addEventListener('input', e => {
  const d = e.target.dataset?.d;
  if (!d) return;
  bulkDraft[d] = e.target.value;
  e.target.closest('.brow').classList.toggle('chg', isChanged(d));
  updateBulkSummary();
});
$('ctaBulk').onclick = () => {
  const ds = changedDates();
  if (!ds.length) return;
  const patch = {};
  for (const d of ds){
    const raw = bulkDraft[d].trim();
    if (raw === ''){ delete db.daily[d]; patch[d] = gone(); }
    else { db.daily[d] = Math.max(0, Math.floor(Number(raw))); patch[d] = db.daily[d]; }
  }
  cloudWrite({ daily: patch });
  cursor = bulkKey; bulkDraft = {};
  goHome();
  toast(`${ds.length}일 저장했어요`);
};

$('price').oninput = renderPrice;
$('rateDateField').onclick = () => openSheet('date-rate');
$('ctaPrice').onclick = () => {
  const n = Math.max(0, Math.floor(Number($('price').value)));
  db.rates[rateDate] = n;
  cloudWrite({ rates: { [rateDate]: n } });
  goHome();
  toast(`${rateFrom(rateDate)} ${fmt(n)}원으로 저장했어요`);
};
$('rateList').onclick = async e => {
  const k = e.target.dataset?.k;
  if (!k) return;
  const ok = await ask({ title:'이 단가를 지울까요?',
                         body:`${rateFrom(k)} ${fmt(db.rates[k])}원. 지우면 그 앞의 단가가 이어서 적용돼요.`,
                         ok:'삭제', danger:true });
  if (!ok) return;
  const dead = gone();
  delete db.rates[k];
  cloudWrite({ rates: { [k]: dead } });
  renderPrice(); renderHome();
  toast('단가를 지웠어요');
};

$('btnClear').onclick = async () => {
  const days = Object.keys(db.daily).length;
  const ok = await ask({ title:'모든 기록을 지울까요?',
                         body:`기록 ${days}일과 단가가 계정에서 전부 없어져요. 되돌릴 수 없습니다.`,
                         ok:'전체 삭제', danger:true });
  if (!ok) return;
  db = { daily:{}, rates:{} };
  cloudReplace();
  goHome();
  toast('전체 기록을 지웠어요');
};

/* ── 로그인 ── */
$('btnLogin').onclick = async () => {
  $('btnLogin').disabled = true;
  gate('wait');
  try{
    await api.signInWithPopup(fbAuth, new api.GoogleAuthProvider());
  }catch(err){
    // 팝업이 막히는 환경(일부 인앱 브라우저)에서는 페이지 이동 방식으로 다시 시도한다
    try{ await api.signInWithRedirect(fbAuth, new api.GoogleAuthProvider()); }
    catch(err2){ gate('fail', err2); }
  }
  $('btnLogin').disabled = false;
};
$('btnRetry').onclick = () => { gate('wait'); startCloud(); };
$('btnLogout').onclick = async () => {
  const ok = await ask({ title:'로그아웃할까요?',
                         body:'기록은 계정에 그대로 남아요. 다시 로그인하면 이어서 볼 수 있습니다.',
                         ok:'로그아웃' });
  if (!ok) return;
  try{ await api.signOut(fbAuth); }catch(err){ console.warn(err); }
};

/* ─────────── 시작 ─────────── */
cursor = cycleKeyOf(todayStr());
gate('wait');
startCloud();          // 로그인이 확인되면 enterApp() 이 화면을 연다

if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

/* 기기 용량이 부족할 때 브라우저가 오프라인 캐시를 임의로 지우지 않도록 요청한다.
   기록 자체는 계정에 있으므로 지워져도 다시 받아온다 */
if (navigator.storage && navigator.storage.persist){
  navigator.storage.persisted().then(ok => { if (!ok) navigator.storage.persist(); }).catch(() => {});
}
</script>
