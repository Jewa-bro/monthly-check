name: APK 빌드

# 손으로 실행하거나, 앱 화면·안드로이드 설정이 바뀌면 자동으로 빌드한다
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icon-*.png'
      - 'favicon.png'
      - 'apple-touch-icon.png'
      - 'android/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write          # 릴리스에 APK 를 올리기 위해 필요

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 안드로이드 SDK 구성 요소 맞추기
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-33" "build-tools;33.0.1"

      - name: 앱 화면을 APK 안으로 복사
        run: |
          mkdir -p android/app/src/main/assets
          # sw.js 는 넣지 않는다: 파일이 이미 APK 안에 있어 서비스워커가 필요 없고,
          # 캐시가 오히려 옛 화면을 붙잡는다
          cp index.html manifest.webmanifest icon-192.png icon-512.png \
             apple-touch-icon.png favicon.png android/app/src/main/assets/
          ls -l android/app/src/main/assets

      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::서명 키 Secret 이 없습니다. ANDROID_KEYSTORE_BASE64 를 등록하세요."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/deliverycheck.keystore
          cat > android/keystore.properties <<EOF
          storeFile=deliverycheck.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: 빌드
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --console=plain

      - name: 서명 확인
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK=$APK" >> $GITHUB_ENV
          ls -l "$APK"
          "$ANDROID_HOME/build-tools/33.0.1/apksigner" verify --print-certs "$APK"

      - name: 지우기 전에 확인용으로 올려두기
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: 내려받을 수 있게 릴리스로 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: 배송 실적 1.0.${{ github.run_number }}
          body: |
            폰에서 이 페이지를 열어 아래 `.apk` 파일을 눌러 설치하세요.
            처음 설치할 때만 '출처를 알 수 없는 앱 설치'를 허용해야 합니다.

            인터넷 없이도 동작하는 완전 오프라인 앱입니다.
            실적은 폰 안에만 저장되므로, 기존에 홈화면 바로가기(PWA)로 넣어둔
            기록이 있으면 **먼저 백업 파일을 저장한 뒤** 이 앱에서 불러오세요.
          files: android/app/build/outputs/apk/release/*.apk
